<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Circle Radiant Gradient: Orange to Deep Ember & Dark -->
    <linearGradient id="vion-bg-grad" x1="12%" y1="8%" x2="88%" y2="92%">
      <stop offset="0%" stop-color="#FF5A00" />
      <stop offset="38%" stop-color="#FF3C00" />
      <stop offset="72%" stop-color="#9E1400" />
      <stop offset="100%" stop-color="#120400" />
    </linearGradient>

    <!-- Outer Rim Bevel Gradient -->
    <linearGradient id="vion-rim-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA666" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#FF3C00" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#400A00" stop-opacity="0.8" />
    </linearGradient>

    <!-- Top Soft Specular Arc -->
    <linearGradient id="vion-specular" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Left Wing Gradient -->
    <linearGradient id="vion-v-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F2F2F6" />
    </linearGradient>

    <!-- Right Wing Gradient (Subtle Dimensional Contrast) -->
    <linearGradient id="vion-v-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F7FA" />
      <stop offset="100%" stop-color="#DEDEE5" />
    </linearGradient>

    <!-- Drop Shadow for V Symbol -->
    <filter id="vion-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- 1. Base Gradient Circle -->
  <circle cx="256" cy="256" r="236" fill="url(#vion-bg-grad)" stroke="url(#vion-rim-grad)" stroke-width="12" />

  <!-- 2. Subtle Glass Highlight (Top Half) -->
  <path d="M 40 256 A 216 216 0 0 1 472 256 A 216 170 0 0 0 40 256 Z" fill="url(#vion-specular)" />

  <!-- 3. Iconic Geometric V (Beveled Fold with Shadow & Signature Dot) -->
  <g filter="url(#vion-shadow)">
    <!-- Left Wing of V -->
    <path
      d="M 132 144 L 256 368 L 256 264 L 186 144 Z"
      fill="url(#vion-v-left)"
    />
    <!-- Right Wing of V -->
    <path
      d="M 256 368 L 380 144 L 326 144 L 256 264 Z"
      fill="url(#vion-v-right)"
    />
    <!-- Center Bevel Seam -->
    <path
      d="M 256 264 L 256 368"
      stroke="#FFFFFF"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-opacity="0.6"
    />
    <!-- Signature VION Dot Accent -->
    <circle
      cx="390"
      cy="352"
      r="24"
      fill="#FFFFFF"
    />
  </g>
</svg>
