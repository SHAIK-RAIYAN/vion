services:
  # 1. Background Queue & Job Store
  redis:
    image: redis:7-alpine
    container_name: vion_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 2. Vion Express API Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vion_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - REDIS_URL=redis://redis:6379
      - ENABLE_WORKER=false
    env_file:
      - path: ./backend/.env
        required: false
    depends_on:
      redis:
        condition: service_healthy

  # 3. Dedicated FFmpeg Video Transcoding Worker
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: vion_worker
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - FFMPEG_PATH=ffmpeg
      - FFPROBE_PATH=ffprobe
      - TEMP_MEDIA_DIR=/app/tmp/media
    env_file:
      - path: ./backend/.env
        required: false
    volumes:
      - worker_media:/app/tmp/media
    depends_on:
      redis:
        condition: service_healthy

  # 4. Vion Next.js App Router Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vion_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api/v1
    depends_on:
      - backend

volumes:
  redis_data:
    name: vion_redis_data
  worker_media:
    name: vion_worker_media
